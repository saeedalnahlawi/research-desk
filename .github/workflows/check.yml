name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every script
        run: python -m compileall -q scripts

      - name: Build the bank tables from the committed manual figures
        run: python scripts/load_manual.py --db /tmp/ci.db

      - name: Assert the ratios actually landed
        run: |
          python - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect("/tmp/ci.db")
          ratios = con.execute("select count(*) from bank_ratios").fetchone()[0]
          mults = con.execute("select count(*) from bank_multiples").fetchone()[0]
          print(f"bank_ratios rows: {ratios}   bank_multiples rows: {mults}")
          if ratios < 3:
              sys.exit("expected at least three period rows in bank_ratios")
          PY
